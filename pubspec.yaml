name: fastcorr_shared
description: "Shared models and services for FastCorr apps"
version: 1.0.0+1
homepage: https://github.com/FastCorr/fastcorr_shared
repository: https://github.com/FastCorr/fastcorr_shared

environment:
  sdk: ^3.9.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^5.6.12
  firebase_core: ^3.15.2
  firebase_storage: ^12.4.5
  data_table_2: ^2.5.6
  file_picker: ^8.0.0+1
  # share_plus: ^10.0.2
  stacked: ^3.0.0
  uuid: ^4.2.1
  iconly: ^1.0.1
  pdfx: ^2.9.2
  universal_html: ^2.2.4
  http: ^1.1.0
  google_maps_flutter: ^2.5.0
  flutter_polyline_points: ^3.0.1
  shared_preferences: ^2.2.2
  woozy_search: ^2.0.3
  url_launcher: ^6.2.5
  stacked_services: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

